<script>
const $=id=>document.getElementById(id);
const TXT=/\.(pwn|inc|p|cfg|json|txt|md|ini|log|sql|yml|yaml|cmd|sh|bat|js|html|css|xml|csv|lua|php)$/i;
const FALLBACK="# SKILL: PawnPilot - Asisten Coding Server SA-MP & open.mp\n\n## 1. Peran\nKamu asisten coding senior untuk server **SA-MP 0.3.7** dan **open.mp**: Pawn, gamemode, filterscript, include (.inc), plugin, `server.cfg` / `config.json`, MySQL, YSI, sscanf, Streamer, dan perbaikan error compile.\nJawab dalam **Bahasa Indonesia**, singkat, langsung ke hasil. Kode dan identifier tetap bahasa Inggris.\n\n## 2. Cara kerja sistem (jangan dilanggar)\n- User mengunggah ZIP proyek. Kamu **tidak melihat isi file** sampai kamu membacanya dengan `<read>`.\n- Setiap pesan kamu diberi konteks: nama proyek, target (samp03 / openmp), dan daftar path file.\n- Kamu mengubah proyek **hanya** lewat tag aksi di bawah. Kode di blok markdown (```) hanya penjelasan dan **tidak mengubah apa pun**.\n- Sistem menjalankan semua tag dalam pesanmu, lalu mengirim balik pesan berawalan `[HASIL AKSI]`.\n- Jika pesanmu berisi `<list/>`, `<read>`, atau `<compile>`, sistem akan membalas dengan hasilnya dan kamu melanjutkan. Maksimal **8 putaran** per permintaan user.\n- Jika pesanmu hanya berisi `<write>`/`<delete>` atau tanpa aksi, giliran selesai.\n- File yang kamu ubah masuk ke ZIP yang diunduh user lewat tombol **Kirim ZIP**. Hasil compile (.amx) otomatis diunduh dan ikut tersimpan di proyek.\n\n## 3. Tag aksi (format harus persis)\nTulis tiap tag di baris sendiri:\n\n```\n<list/>\n<read path=\"gamemodes/main.pwn\"/>\n<write path=\"gamemodes/main.pwn\">\nISI FILE LENGKAP\n<\/write>\n<delete path=\"filterscripts/lama.pwn\"/>\n<compile target=\"samp03\" file=\"gamemodes/main.pwn\"/>\n```\n\nAturan:\n- `path` relatif dari root ZIP, memakai `/`, tanpa awalan `/` dan tanpa `..` (selain itu ditolak sistem).\n- `<write>` **mengganti seluruh isi file**. Selalu tulis file utuh, salin bagian yang tidak berubah dengan akurat. Satu baris kosong pertama dan terakhir diabaikan.\n- `<read>` file biner (.amx, .so, .dll, gambar) tidak bisa dibaca. File teks sangat panjang terpotong; sistem memberi tahu jika terpotong.\n- `<compile>`: `target` = `samp03` atau `openmp` (kalau dikosongkan memakai target dari konteks); `file` = path .pwn utama (kalau dikosongkan sistem memakai file .pwn pertama di `gamemodes/`).\n- Setelah menulis `<list/>`, `<read>`, atau `<compile>`, **berhenti** dan tunggu `[HASIL AKSI]`. Jangan menebak atau mengarang hasilnya.\n- Jangan membungkus tag aksi dalam blok kode markdown.\n\n## 4. Alur kerja\n1. Pahami permintaan. Bila belum jelas, tanya **satu** pertanyaan singkat.\n2. `<list/>` bila belum tahu strukturnya, lalu `<read>` file yang relevan sebelum mengedit.\n3. Edit seminimal mungkin lewat `<write>`.\n4. Setelah mengubah `.pwn` / `.inc`, jalankan `<compile>`. Jika ada error, baca log, perbaiki, compile lagi.\n5. Jika masih gagal setelah 3 kali percobaan compile, berhenti dan jelaskan masalahnya ke user.\n6. Laporkan ringkas: file yang diubah, apa yang berubah, hasil compile.\n\n## 5. Aturan kode Pawn\n- Indentasi 4 spasi, semua statement diakhiri `;`.\n- SA-MP 0.3.7: `#include <a_samp>`. open.mp: `#include <open.mp>`.\n- Perhatikan ukuran string (`new str[128]`), `MAX_PLAYERS`, dan reset data pemain di `OnPlayerDisconnect`.\n- MySQL: gunakan `mysql_format` dengan `%e` / `%d`. Jangan menyambung input user langsung ke query.\n- Jangan menaruh password atau token di kode.\n- Ikuti library command yang sudah dipakai proyek (ZCMD, Pawn.CMD, YCMD); jangan mencampur.\n- Jangan menghapus callback atau fungsi lama kecuali diminta.\n\n## 6. Membaca log compile\n- Error pertama sering menyebabkan error berikutnya; perbaiki dari atas.\n- `undefined symbol`: include atau forward hilang. `tag mismatch`: tipe/tag salah. `array index out of bounds`: indeks melebihi ukuran.\n- Warning boleh dirapikan, tetapi error wajib beres sebelum melapor selesai.\n- Jika log berisi `pawncc tidak ditemukan`, itu masalah server compiler: sampaikan ke user, jangan mengubah kode.\n\n## 7. Format jawaban\n- Mulai dari kesimpulan, tanpa basa-basi.\n- Perubahan dijelaskan dalam daftar maksimal 5 poin.\n- Hal berisiko (menghapus file, menimpa data pemain, perubahan besar) dikonfirmasi dulu.\n\n## 8. Batasan\n- Hanya bekerja pada file dari ZIP yang diunggah.\n- Jangan menulis malware, backdoor, RCON stealer, atau kode penyerang server lain.\n- Jangan menghapus atau menimpa `.db`, `.sql`, dan `scriptfiles/` tanpa persetujuan jelas.\n";
const SRV={"server.js":"// PawnPilot server. Jalankan: npm install && node server.js\n// Struktur: server.js, index.html, package.json,\n//   compiler/samp03/pawncc (+ include/)   compiler/openmp/pawncc (+ include/)\n// Env opsional: AI_KEY (API key, jadi user tidak perlu isi di web), AI_BASE, PORT\nconst express = require('express'), path = require('path'), fs = require('fs'), os = require('os');\nconst { execFile } = require('child_process');\nconst AdmZip = require('adm-zip');\nconst app = express();\nconst PORT = process.env.SERVER_PORT || process.env.PORT || 3000;\nconst BASE = (process.env.AI_BASE || 'https://router.bynara.id/v1').replace(/\\/$/, '');\n\napp.use((q, r, n) => { r.set({ 'Access-Control-Allow-Origin': '*', 'Access-Control-Allow-Headers': '*' }); q.method === 'OPTIONS' ? r.sendStatus(204) : n(); });\napp.use(express.json({ limit: '20mb' }));\napp.get('/', (_, r) => r.sendFile(path.join(__dirname, 'index.html')));\napp.get('/api/health', (_, r) => r.json({ ok: true, key: !!process.env.AI_KEY }));\n\napp.post('/api/chat', async (req, res) => {\n  const { model, messages, key } = req.body || {};\n  const k = key || process.env.AI_KEY;\n  if (!k) return res.status(400).json({ error: 'API key belum diisi' });\n  try {\n    const r = await fetch(BASE + '/chat/completions', {\n      method: 'POST',\n      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + k },\n      body: JSON.stringify({ model, messages })\n    });\n    res.status(r.status).type('json').send(await r.text());\n  } catch (e) { res.status(502).json({ error: e.message }); }\n});\n\nfunction walk(d, o = []) {\n  for (const f of fs.readdirSync(d, { withFileTypes: true })) {\n    const p = path.join(d, f.name);\n    f.isDirectory() ? walk(p, o) : o.push(p);\n  }\n  return o;\n}\n\napp.post('/api/compile', express.raw({ type: '*/*', limit: '100mb' }), (req, res) => {\n  const target = req.get('x-target') === 'openmp' ? 'openmp' : 'samp03';\n  const dir = fs.mkdtempSync(path.join(os.tmpdir(), 'pp-'));\n  const done = o => { fs.rmSync(dir, { recursive: true, force: true }); res.json(o); };\n  try {\n    new AdmZip(req.body).getEntries().forEach(e => {\n      if (e.isDirectory) return;\n      const p = path.resolve(dir, e.entryName);\n      if (!p.startsWith(dir + path.sep)) return;\n      fs.mkdirSync(path.dirname(p), { recursive: true });\n      fs.writeFileSync(p, e.getData());\n    });\n    let main = req.get('x-file') || '';\n    if (!main) {\n      const all = walk(dir).map(p => path.relative(dir, p).split(path.sep).join('/'));\n      main = all.find(p => /^gamemodes\\/.+\\.pwn$/i.test(p)) || all.find(p => /\\.pwn$/i.test(p)) || '';\n    }\n    const mainAbs = path.resolve(dir, main);\n    if (!main || !/\\.pwn$/i.test(main) || !mainAbs.startsWith(dir + path.sep) || !fs.existsSync(mainAbs))\n      return done({ ok: false, log: 'File .pwn utama tidak ditemukan: ' + (main || '(kosong)') });\n\n    const cdir = path.join(__dirname, 'compiler', target);\n    const exe = path.join(cdir, process.platform === 'win32' ? 'pawncc.exe' : 'pawncc');\n    const incs = [path.join(cdir, 'include'), path.join(dir, 'pawno/include'), path.join(dir, 'qawno/include'),\n      path.join(dir, 'include'), path.dirname(mainAbs)].filter(fs.existsSync);\n    const outRel = main.replace(/\\.pwn$/i, '.amx');\n    const args = [main, '-;+', '-(+', '-d3', ...incs.map(i => '-i' + i), '-o' + path.join(dir, outRel)];\n    execFile(exe, args, { cwd: dir, timeout: 60000, maxBuffer: 8e6 }, (err, so, se) => {\n      let log = ((so || '') + (se || '')).trim();\n      if (err && err.code === 'ENOENT') log = 'pawncc tidak ditemukan di compiler/' + target + '/';\n      const out = path.join(dir, outRel);\n      if (fs.existsSync(out)) done({ ok: true, log, name: outRel, amx: fs.readFileSync(out).toString('base64') });\n      else done({ ok: false, log: log || (err ? err.message : 'Compile gagal') });\n    });\n  } catch (e) { done({ ok: false, log: 'Server error: ' + e.message }); }\n});\n\napp.listen(PORT, () => console.log('PawnPilot jalan di port ' + PORT));\n","package.json":"{\n  \"name\": \"pawnpilot\",\n  \"version\": \"1.0.0\",\n  \"main\": \"server.js\",\n  \"scripts\": { \"start\": \"node server.js\" },\n  \"engines\": { \"node\": \">=18\" },\n  \"dependencies\": { \"adm-zip\": \"^0.5.16\", \"express\": \"^4.19.2\" }\n}\n"};
const MAXR=8,MAXREAD=60000;
let files={},proj="",hist=[],busy=false,cur="",skill="",server=false,srvKey=false;
const cfg=Object.assign({base:"https://router.bynara.id/v1",model:"agnes-3-flash",key:"",tg:"samp03",sk:"",srv:""},JSON.parse(localStorage.getItem("pp_cfg")||"{}"));
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const kb=n=>n<1024?n+" B":(n/1024).toFixed(1)+" KB";
const at=(s,k)=>(s.match(new RegExp("\\b"+k+'="([^"]*)"'))||[])[1];
const persist=()=>localStorage.setItem("pp_cfg",JSON.stringify(cfg));

function md(t){
  t=t.replace(/<write path="([^"]+)">[\s\S]*?<\/write>/g,(_,p)=>"\u0001tulis "+p+"\u0002")
   .replace(/<read path="([^"]+)"\s*\/>/g,(_,p)=>"\u0001baca "+p+"\u0002")
   .replace(/<delete path="([^"]+)"\s*\/>/g,(_,p)=>"\u0001hapus "+p+"\u0002")
   .replace(/<list\s*\/>/g,"\u0001daftar file\u0002")
   .replace(/<compile\b([^>]*)\/>/g,(_,a)=>"\u0001compile "+(at(a,"target")||cfg.tg)+"\u0002");
  return esc(t).replace(/```\w*\n?([\s\S]*?)```/g,(_,c)=>"<pre><code>"+c+"</code></pre>")
   .replace(/`([^`\n]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>")
   .replace(/\u0001(.*?)\u0002/g,'<code>$1</code>').replace(/\n/g,"<br>").replace(/<br>(<\/?pre)/g,"$1").replace(/(<\/pre>)<br>/g,"$1");
}
function msg(who,html){
  const e=$("empty");if(e)e.remove();
  const d=document.createElement("div");d.className="msg "+(who==="u"?"u":"");
  d.innerHTML='<div class="bd">'+html+"</div>";
  $("log").appendChild(d);$("log").scrollTop=1e9;return d.querySelector(".bd");
}
function note(t){const d=document.createElement("div");d.className="note";d.textContent=t;$("log").appendChild(d);$("log").scrollTop=1e9}
function card(bd,state,txt,log){
  let w=bd.querySelector(".acts");if(!w){w=document.createElement("div");w.className="acts";bd.appendChild(w)}
  const c=document.createElement(log?"details":"div");c.className="act "+state;
  if(log){const m=document.createElement("summary");m.textContent=txt;c.appendChild(m);const p=document.createElement("pre");p.textContent=log;c.appendChild(p);if(state==="er")c.open=true}else c.textContent=txt;
  w.appendChild(c);$("log").scrollTop=1e9;
}

function tree(){
  const all=Object.keys(files),q=($("flt").value||"").toLowerCase(),k=all.sort().filter(p=>p.toLowerCase().includes(q));let last=null,h="";
  for(const p of k){const i=p.lastIndexOf("/"),d=i<0?"/":p.slice(0,i),n=p.slice(i+1),x=(n.split(".").pop()||"").toLowerCase();
    if(d!==last){h+='<div class="fd">'+esc(d)+"</div>";last=d}
    h+='<div class="f" data-p="'+esc(p)+'"><i class="d '+x+'"></i><span>'+esc(n)+"</span><small>"+kb(files[p].length)+"</small></div>"}
  $("tr").innerHTML=h||'<div class="emp">'+(all.length?"Tidak ada file cocok":"Belum ada proyek. Buka ZIP dulu.")+"</div>";
  $("pc").textContent=proj?proj+" \u00b7 "+all.length+" file":"Belum ada proyek";
}
$("tr").onclick=e=>{const f=e.target.closest(".f");if(f){$("sd").classList.remove("o");openEd(f.dataset.p)}};
function gutter(){const n=$("ed").value.split("\n").length;$("gt").textContent=Array.from({length:n},(_,i)=>i+1).join("\n")}
$("ed").oninput=gutter;$("ed").onscroll=()=>$("gt").scrollTop=$("ed").scrollTop;
function openEd(p){
  if(typeof files[p]!=="string")return note("File biner tidak bisa diedit: "+p);
  cur=p;$("et").textContent=p;$("ed").value=files[p];gutter();$("de").showModal();
}
$("esv").onclick=()=>{files[cur]=$("ed").value;tree();$("de").close()};
$("ecl").onclick=()=>$("de").close();
$("edl").onclick=()=>{if(confirm("Hapus "+cur+"?")){delete files[cur];tree();$("de").close()}};
$("tg").onclick=()=>$("sd").classList.toggle("o");$("xd").onclick=$("bk").onclick=()=>$("sd").classList.remove("o");$("flt").oninput=tree;

async function loadZip(f){
  try{
    const z=await JSZip.loadAsync(f);files={};proj=f.name;
    for(const [p,en] of Object.entries(z.files)){if(en.dir||p.startsWith("__MACOSX"))continue;
      files[p]=TXT.test(p)?await en.async("string"):await en.async("uint8array")}
    tree();note("ZIP dimuat: "+Object.keys(files).length+" file.");$("sd").classList.remove("o");
  }catch(x){note("Gagal membuka ZIP: "+x.message)}
}
document.addEventListener("click",e=>{if(e.target.closest("[data-zip]"))$("fz").click()});
$("fz").onchange=e=>{if(e.target.files[0])loadZip(e.target.files[0]);e.target.value=""};
addEventListener("dragover",e=>{e.preventDefault();document.body.classList.add("hot")});
addEventListener("dragleave",e=>{if(!e.relatedTarget)document.body.classList.remove("hot")});
addEventListener("drop",e=>{e.preventDefault();document.body.classList.remove("hot");const f=e.dataTransfer.files[0];if(f&&/\.zip$/i.test(f.name))loadZip(f)});

async function makeZip(){const z=new JSZip();for(const [p,v] of Object.entries(files))z.file(p,v);return z.generateAsync({type:"blob",compression:"DEFLATE"})}
function save(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
$("bd").onclick=async()=>{if(!Object.keys(files).length)return note("Belum ada file.");save(await makeZip(),(proj||"proyek.zip").replace(/\.zip$/i,"")+"-edit.zip")};

async function compile(target,file){
  if(!Object.keys(files).length)return{ok:false,log:"Tidak ada proyek."};
  if(!server)return{ok:false,log:"Compile butuh server (pawncc tidak bisa jalan di browser). Buka Pengaturan, unduh server.js, jalankan di server, lalu isi Alamat server."};
  try{
    const r=await fetch(cfg.srv.replace(/\/$/,"")+"/api/compile",{method:"POST",headers:{"x-target":target||cfg.tg,"x-file":file||""},body:await makeZip()});
    const j=await r.json();
    if(j.ok&&j.amx){const u=Uint8Array.from(atob(j.amx),c=>c.charCodeAt(0));files[j.name]=u;tree();save(new Blob([u]),j.name.split("/").pop())}
    return j;
  }catch(x){return{ok:false,log:"Compile gagal: "+x.message}}
}
async function manualCompile(){
  if(busy)return;busy=true;const bd=msg("a","Compile "+cfg.tg+"...");const r=await compile();
  card(bd,r.ok?"ok":"er",r.ok?"Berhasil, "+r.name+" diunduh":"Compile gagal",(r.log||"").slice(0,6000));busy=false;
}
$("bc").onclick=manualCompile;

const safe=p=>p&&!p.startsWith("/")&&!p.split("/").includes("..");
async function runActions(t,bd){
  const out=[];let again=false,m;
  const w=/<write path="([^"]+)">\n?([\s\S]*?)\n?<\/write>/g;
  while((m=w.exec(t))){if(!safe(m[1])){out.push("write "+m[1]+": path ditolak");card(bd,"er","Ditolak: "+m[1]);continue}
    files[m[1]]=m[2];out.push("write "+m[1]+": OK ("+m[2].length+" karakter)");card(bd,"wr","Menulis "+m[1])}
  const rd=/<read path="([^"]+)"\s*\/>/g;
  while((m=rd.exec(t))){again=true;const v=files[m[1]];
    if(v===undefined){out.push("read "+m[1]+": TIDAK ADA");card(bd,"er","Tidak ada: "+m[1])}
    else if(typeof v!=="string"){out.push("read "+m[1]+": file biner, tidak bisa dibaca");card(bd,"er","Biner: "+m[1])}
    else{const cut=v.length>MAXREAD;out.push("read "+m[1]+(cut?" (TERPOTONG, "+v.length+" karakter total)":"")+":\n"+v.slice(0,MAXREAD));card(bd,"ok","Membaca "+m[1])}}
  const dl=/<delete path="([^"]+)"\s*\/>/g;
  while((m=dl.exec(t))){if(m[1] in files){delete files[m[1]];out.push("delete "+m[1]+": OK");card(bd,"wr","Menghapus "+m[1])}else{out.push("delete "+m[1]+": TIDAK ADA");card(bd,"er","Tidak ada: "+m[1])}}
  if(/<list\s*\/>/.test(t)){again=true;out.push("list:\n"+Object.entries(files).map(([p,v])=>p+" ("+v.length+")").join("\n"));card(bd,"ok","Daftar file")}
  const cm=t.match(/<compile\b([^>]*)\/>/);
  if(cm){again=true;const tg=at(cm[1],"target")||cfg.tg,fl=at(cm[1],"file")||"";
    const r=await compile(tg,fl),lg=(r.log||"").slice(0,6000);
    out.push("compile "+tg+(r.ok?" BERHASIL, output: "+r.name+" (diunduh dan disimpan di proyek)":" GAGAL")+":\n"+lg);
    card(bd,r.ok?"ok":"er","Compile "+tg+(r.ok?" berhasil":" gagal"),lg)}
  tree();return{out,again};
}

async function ask(){
  const ctx=(cfg.sk||skill||FALLBACK)+"\n\n[KONTEKS]\nProyek: "+(proj||"(belum ada)")+"\nTarget default: "+cfg.tg+"\nFile ("+Object.keys(files).length+"):\n"+Object.keys(files).sort().slice(0,300).join("\n");
  const body={model:cfg.model,messages:[{role:"system",content:ctx},...hist]};
  let r;
  if(server)r=await fetch(cfg.srv.replace(/\/$/,"")+"/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...body,key:cfg.key})});
  else{if(!cfg.key)throw new Error("API key belum diisi (buka Pengaturan)");
    r=await fetch(cfg.base.replace(/\/$/,"")+"/chat/completions",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+cfg.key},body:JSON.stringify(body)})}
  const tx=await r.text();if(!r.ok)throw new Error("HTTP "+r.status+" "+tx.slice(0,300));
  const j=JSON.parse(tx);return j.choices?.[0]?.message?.content||"(kosong)";
}
async function send(txt){
  if(busy||!txt.trim())return;
  if(!cfg.key&&!(server&&srvKey)){note("Isi API key di Pengaturan dulu.");$("dc").showModal();return}
  busy=true;$("sb").disabled=true;msg("u",esc(txt));hist.push({role:"user",content:txt});
  try{
    for(let i=0;i<MAXR;i++){
      const bd=msg("a",'<span class="dots"><i></i><i></i><i></i></span>');const rep=await ask();
      hist.push({role:"assistant",content:rep});bd.innerHTML=md(rep);
      const {out,again}=await runActions(rep,bd);
      if(!out.length)break;
      hist.push({role:"user",content:"[HASIL AKSI]\n"+out.join("\n\n")});
      if(!again)break;
      if(i===MAXR-1)note("Batas "+MAXR+" putaran tercapai. Kirim pesan lagi untuk melanjutkan.");
    }
  }catch(x){note(x.message==="Failed to fetch"&&!server?"Gagal terhubung ke API. Hampir pasti diblokir CORS karena halaman dibuka tanpa server. Jalankan lewat node server.js lalu buka alamat servernya.":"Error: "+x.message)}
  busy=false;$("sb").disabled=false;$("in").focus();
}
$("fm").onsubmit=e=>{e.preventDefault();const v=$("in").value;$("in").value="";$("in").style.height="";send(v)};
$("in").oninput=()=>{$("in").style.height="auto";$("in").style.height=Math.min($("in").scrollHeight,160)+"px"};
$("in").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey&&innerWidth>640){e.preventDefault();$("fm").requestSubmit()}};
$("log").onclick=e=>{if(e.target.closest(".sg button"))send(e.target.textContent)};

function seg(){document.querySelectorAll("#sg button").forEach(b=>b.classList.toggle("on",b.dataset.t===cfg.tg))}
$("sg").onclick=e=>{const b=e.target.closest("button");if(b){cfg.tg=b.dataset.t;persist();seg()}};
$("bs").onclick=()=>{$("c_base").value=cfg.base;$("c_model").value=cfg.model;$("c_key").value=cfg.key;$("c_srv").value=cfg.srv;$("c_sk").value=cfg.sk||skill||FALLBACK;$("dc").showModal()};
$("ccl").onclick=()=>$("dc").close();
$("skr").onclick=()=>{cfg.sk="";persist();$("c_sk").value=skill||FALLBACK};
$("dls").onclick=async()=>{const z=new JSZip();for(const [n,c] of Object.entries(SRV))z.file(n,c);save(await z.generateAsync({type:"blob"}),"pawnpilot-server.zip")};
$("sv").onclick=async()=>{cfg.srv=$("c_srv").value.trim();cfg.base=$("c_base").value.trim();cfg.model=$("c_model").value.trim();cfg.key=$("c_key").value.trim();
  const s=$("c_sk").value;cfg.sk=(s===(skill||FALLBACK))?"":s;persist();$("dc").close();await chk();note("Pengaturan disimpan. "+(server?"Server terhubung.":"Server tidak terdeteksi."))};
async function chk(){server=false;srvKey=false;try{const h=await (await fetch(cfg.srv.replace(/\/$/,"")+"/api/health")).json();server=!!h.ok;srvKey=!!h.key}catch(_){}}
(async()=>{
  seg();
  await chk();
  if(!server)note("Mode tanpa server: chat langsung ke API, compile nonaktif. Unduh server.js dari Pengaturan untuk compile.");
})();
</script>
</body>
